openapi: 3.1.0
info:
  title: ZH-LAO Admin Lao Letter Table and Batch API
  version: 1.0.0
  description: >-
    SpecKit downstream contract compiled from D-167, ADR-028 and
    CONTENT_LANGUAGE_ADMIN_API.md. Canonical documents remain authoritative.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: LaoLetterAdmin
    description: Server-side Lao letter list, selection preview, and owned batch-task operations.
paths:
  /api/v1/admin/content/lo/letters:
    get:
      tags: [LaoLetterAdmin]
      operationId: API-LettersQuery
      summary: Query the Lao letter administration list
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/LetterType'
        - $ref: '#/components/parameters/LetterClass'
        - $ref: '#/components/parameters/ContentStatus'
        - $ref: '#/components/parameters/RevisionStatus'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/LetterPageSize'
      responses:
        '200':
          description: ADR-023 success or business-error envelope
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LetterListSuccess'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/admin/content/lo/letters/selection-preview:
    post:
      tags: [LaoLetterAdmin]
      operationId: API-LettersSelectionPreview
      summary: Preview and fingerprint all records matching a normalized query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  $ref: '#/components/schemas/NormalizedLetterQuery'
      responses:
        '200':
          description: ADR-023 success or business-error envelope
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SelectionPreviewSuccess'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/admin/content/lo/letters/batch-tasks:
    post:
      tags: [LaoLetterAdmin]
      operationId: API-LettersBatchStart
      summary: Create an asynchronous letter batch task
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchTaskRequest'
      responses:
        '200':
          description: ADR-023 success or business-error envelope
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BatchTaskCreatedSuccess'
                  - $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [LaoLetterAdmin]
      operationId: API-LettersBatchTaskList
      summary: List batch tasks created by the current Operator
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/TaskPageSize'
      responses:
        '200':
          description: ADR-023 success or business-error envelope
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BatchTaskListSuccess'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/admin/content/lo/letters/batch-tasks/{task_id}:
    get:
      tags: [LaoLetterAdmin]
      operationId: API-LettersBatchTask
      summary: Get one owned task and its paginated item results
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/TaskPageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BatchItemStatus'
      responses:
        '200':
          description: ADR-023 success or business-error envelope
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BatchTaskDetailSuccess'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/admin/content/lo/letters/batch-tasks/{task_id}/retry-failed:
    post:
      tags: [LaoLetterAdmin]
      operationId: API-LettersBatchRetry
      summary: Requeue failed items of an owned batch task
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: ADR-023 success or business-error envelope
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BatchTaskCreatedSuccess'
                  - $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 128
    LetterType:
      name: letter_type
      in: query
      description: Comma-separated, de-duplicated values.
      schema:
        type: string
        pattern: '^(consonant|vowel|tone_mark|other)(,(consonant|vowel|tone_mark|other))*$'
    LetterClass:
      name: letter_class
      in: query
      description: Comma-separated values from registered non-empty letter classes.
      schema:
        type: string
    ContentStatus:
      name: content_status
      in: query
      schema:
        type: string
        pattern: '^(active|disabled|archived)(,(active|disabled|archived))*$'
    RevisionStatus:
      name: revision_status
      in: query
      schema:
        type: string
        pattern: '^(draft|pending_review|approved|rejected|none)(,(draft|pending_review|approved|rejected|none))*$'
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [sort_order, character, name, romanization, updated_at]
        default: sort_order
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LetterPageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    TaskPageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RequestId:
      type: string
      minLength: 1
    LetterTypeValue:
      type: string
      enum: [consonant, vowel, tone_mark, other]
    ContentStatusValue:
      type: string
      enum: [active, disabled, archived]
    RevisionStatusValue:
      type: string
      enum: [draft, pending_review, approved, rejected]
    BatchAction:
      type: string
      enum: [submit_review, approve, reject, publish, archive]
    BatchTaskStatus:
      type: string
      enum: [queued, running, completed, completed_with_issues, failed]
    BatchItemStatus:
      type: string
      enum: [queued, running, succeeded, failed, skipped]
    NormalizedLetterQuery:
      type: object
      additionalProperties: false
      properties:
        q:
          type: string
          maxLength: 128
        letter_type:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LetterTypeValue'
        letter_class:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        content_status:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ContentStatusValue'
        revision_status:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [draft, pending_review, approved, rejected, none]
        sort:
          type: string
          enum: [sort_order, character, name, romanization, updated_at]
          default: sort_order
        order:
          type: string
          enum: [asc, desc]
          default: asc
    LetterListItem:
      type: object
      additionalProperties: false
      required: [content_id, character, letter_type, content_status, updated_at, available_actions]
      properties:
        content_id:
          type: string
          format: uuid
        character:
          type: string
          minLength: 1
          maxLength: 16
        letter_type:
          $ref: '#/components/schemas/LetterTypeValue'
        letter_class:
          type: [string, 'null']
        name:
          type: [string, 'null']
        romanization:
          type: [string, 'null']
        sort_order:
          type: [integer, 'null']
        content_status:
          $ref: '#/components/schemas/ContentStatusValue'
        working_revision_id:
          type: [string, 'null']
          format: uuid
        working_revision_status:
          oneOf:
            - $ref: '#/components/schemas/RevisionStatusValue'
            - type: 'null'
        lock_version:
          type: [integer, 'null']
          minimum: 0
        updated_at:
          type: string
          format: date-time
        available_actions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BatchAction'
    LetterListData:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, batch_actions]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LetterListItem'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 500
        total:
          type: integer
          minimum: 0
        batch_actions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BatchAction'
    LetterListSuccess:
      type: object
      additionalProperties: false
      required: [code, data, request_id]
      properties:
        code:
          const: OK
        data:
          $ref: '#/components/schemas/LetterListData'
        request_id:
          $ref: '#/components/schemas/RequestId'
    SelectionPreviewData:
      type: object
      additionalProperties: false
      required: [query, expected_count, selection_hash]
      properties:
        query:
          $ref: '#/components/schemas/NormalizedLetterQuery'
        expected_count:
          type: integer
          minimum: 0
        selection_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
    SelectionPreviewSuccess:
      type: object
      additionalProperties: false
      required: [code, data, request_id]
      properties:
        code:
          const: OK
        data:
          $ref: '#/components/schemas/SelectionPreviewData'
        request_id:
          $ref: '#/components/schemas/RequestId'
    ExplicitSelection:
      type: object
      additionalProperties: false
      required: [mode, content_ids, expected_count]
      properties:
        mode:
          const: explicit_ids
        content_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        expected_count:
          type: integer
          minimum: 1
    QueryAllSelection:
      type: object
      additionalProperties: false
      required: [mode, query, expected_count, selection_hash]
      properties:
        mode:
          const: query_all
        query:
          $ref: '#/components/schemas/NormalizedLetterQuery'
        expected_count:
          type: integer
          minimum: 1
        selection_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
    CreateBatchTaskRequest:
      type: object
      additionalProperties: false
      required: [action, selection]
      properties:
        action:
          $ref: '#/components/schemas/BatchAction'
        selection:
          oneOf:
            - $ref: '#/components/schemas/ExplicitSelection'
            - $ref: '#/components/schemas/QueryAllSelection'
          discriminator:
            propertyName: mode
        reason:
          type: string
          minLength: 1
          description: Required only for reject and archive; forbidden for other actions.
      allOf:
        - if:
            properties:
              action:
                enum: [reject, archive]
            required: [action]
          then:
            properties:
              reason:
                type: string
                minLength: 1
            required: [reason]
          else:
            not:
              properties:
                reason: {}
              required: [reason]
    BatchTaskSummary:
      type: object
      additionalProperties: false
      required:
        - task_id
        - action
        - selection_mode
        - status
        - target_count
        - processed_count
        - succeeded_count
        - failed_count
        - skipped_count
        - created_at
      properties:
        task_id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/BatchAction'
        selection_mode:
          type: string
          enum: [explicit_ids, query_all]
        status:
          $ref: '#/components/schemas/BatchTaskStatus'
        target_count:
          type: integer
          minimum: 1
        processed_count:
          type: integer
          minimum: 0
        succeeded_count:
          type: integer
          minimum: 0
        failed_count:
          type: integer
          minimum: 0
        skipped_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        last_error_code:
          type: [string, 'null']
    BatchTaskCreatedSuccess:
      type: object
      additionalProperties: false
      required: [code, data, request_id]
      properties:
        code:
          const: OK
        data:
          $ref: '#/components/schemas/BatchTaskSummary'
        request_id:
          $ref: '#/components/schemas/RequestId'
    BatchTaskListData:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchTaskSummary'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    BatchTaskListSuccess:
      type: object
      additionalProperties: false
      required: [code, data, request_id]
      properties:
        code:
          const: OK
        data:
          $ref: '#/components/schemas/BatchTaskListData'
        request_id:
          $ref: '#/components/schemas/RequestId'
    BatchTaskItem:
      type: object
      additionalProperties: false
      required: [item_no, content_id, status, retry_count]
      properties:
        item_no:
          type: integer
          minimum: 1
        content_id:
          type: string
          format: uuid
        revision_id:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/BatchItemStatus'
        error_code:
          type: [string, 'null']
        error_message:
          type: [string, 'null']
        retry_count:
          type: integer
          minimum: 0
        completed_at:
          type: [string, 'null']
          format: date-time
    BatchTaskDetailData:
      type: object
      additionalProperties: false
      required: [task, items, page, page_size, total]
      properties:
        task:
          $ref: '#/components/schemas/BatchTaskSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchTaskItem'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    BatchTaskDetailSuccess:
      type: object
      additionalProperties: false
      required: [code, data, request_id]
      properties:
        code:
          const: OK
        data:
          $ref: '#/components/schemas/BatchTaskDetailData'
        request_id:
          $ref: '#/components/schemas/RequestId'
    ErrorBody:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
        details:
          type: [object, array, 'null']
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, error, request_id]
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_ERROR
            - INVALID_DATA
            - STALE_VERSION_CONFLICT
            - ACTIVE_WORK_CONFLICT
            - ILLEGAL_STATE_TRANSITION
            - BATCH_SELECTION_CHANGED
            - BATCH_TASK_NOT_RETRYABLE
            - CONFLICT
            - RATE_LIMITED
            - INTERNAL_ERROR
        error:
          $ref: '#/components/schemas/ErrorBody'
        request_id:
          $ref: '#/components/schemas/RequestId'
