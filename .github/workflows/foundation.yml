name: Foundation
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.20.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: "**/pnpm-lock.yaml" }
      - run: pnpm --dir database install --frozen-lockfile
      - run: pnpm --dir apps/backend install --frozen-lockfile
      - run: pnpm --dir apps/backend verify
      - run: pnpm --dir apps/backend build
      - run: pnpm --dir apps/backend test:integration
      - run: pnpm --dir database test
      - run: pnpm --dir database validate
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.20.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: "**/pnpm-lock.yaml" }
      - run: pnpm --dir apps/admin install --frozen-lockfile
      - run: pnpm --dir apps/admin verify
      - run: pnpm --dir apps/admin exec playwright install --with-deps chromium
      - run: pnpm --dir apps/admin e2e
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.20.0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pyyaml
      - run: python scripts/audit_feature_detail_pages.py
      - run: python scripts/audit_feature_state_machine.py
      - run: python scripts/check_doc_metadata.py
      - run: python scripts/validate_feature_pages.py
      # SUPERSEDED (Stage 6, 2026-09-02): ZH-LAO Executable Spec System retired.
      # The legacy checker below is no longer an active Spec Gate. No Spec Kit
      # analyze CI replaces it (NO_ACTIVE_SPEC_ANALYZE_CI). Kept commented for traceability.
      # - run: python scripts/check_executable_specs.py
      - run: pnpm --dir docs install --frozen-lockfile
      - run: pnpm --dir docs docs:build
  # Mobile regression coverage.
  #
  # NOT a formal repository-wide mandatory Gate: Mobile Foundation is currently
  # IN_PROGRESS (see MOBILE_FOUNDATION_PLAN.md / DEVELOPMENT_PROGRESS.md), so
  # MOBILE_FOUNDATION_GATE has not been declared PASS. This job keeps independent
  # verification running (typecheck/lint/test/audit) so regressions surface early,
  # but it is explicitly non-blocking until Mobile completes its own gate. It must
  # NOT be interpreted as declaring MOBILE_FOUNDATION_GATE = PASS.
  mobile:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.20.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: "**/pnpm-lock.yaml" }
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir apps/mobile verify
