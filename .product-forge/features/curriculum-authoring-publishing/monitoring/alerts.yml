feature: "curriculum-authoring-publishing"
provider: "manual"
status: "not_provisioned"
alerts:
  - name: "Curriculum runtime error rate"
    condition: "5xx responses for /api/v1/content/courses* exceed 5% for 5 minutes"
    severity: "P1"
    required_channel: "on-call release channel"
  - name: "Curriculum runtime latency"
    condition: "p95 latency for /api/v1/content/courses* exceeds the service SLO for 10 minutes"
    severity: "P2"
    required_channel: "on-call release channel"
  - name: "Curriculum publish failure"
    condition: "publish failures exceed 3 in 15 minutes, excluding typed validation and conflict responses"
    severity: "P2"
    required_channel: "content operations channel"
  - name: "Curriculum audit persistence failure"
    condition: "any transaction audit persistence failure"
    severity: "P1"
    required_channel: "on-call release channel"
action_required: "Provision these alerts in the production observability provider before production rollout."
