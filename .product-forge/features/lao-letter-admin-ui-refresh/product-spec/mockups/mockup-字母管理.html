<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>字母管理原型</title><style>:root{--background:#fafafa;--foreground:#111827;--card:#fff;--primary:#2563eb;--primary-foreground:#fff;--muted:#f5f5f5;--muted-foreground:#4b5563;--border:#e5e7eb;--radius:.5rem;--success:#059669;--warning:#d97706}body{margin:0;background:var(--background);color:var(--foreground);font:14px system-ui,sans-serif}.page{max-width:1280px;margin:auto;padding:24px}.crumb{color:var(--muted-foreground);font-size:12px}.hero,.toolbar,.heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hero{justify-content:space-between;margin:10px 0 20px}.hero h1{margin:0;font-size:24px}.count{background:var(--muted);border-radius:99px;padding:3px 8px;color:var(--muted-foreground);font-size:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 2px #0000000a;margin-block:12px}.toolbar{padding:12px}.search{min-width:220px;flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px}.button{border:1px solid var(--border);background:var(--card);border-radius:var(--radius);padding:9px 12px}.button.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}.summary{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--muted-foreground)}table{width:100%;border-collapse:collapse}th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--border)}th{background:var(--muted);font-size:12px;color:var(--muted-foreground)}.char{font-size:20px;font-weight:700}.badge{display:inline-block;border-radius:99px;padding:3px 8px;font-size:12px;background:#ecfdf5;color:var(--success)}.sidebar{padding:14px 16px}.history{color:var(--muted-foreground);font-size:13px}@media(max-width:640px){.page{padding:16px}.hero{align-items:flex-start}.toolbar>*{width:100%}.button{width:auto}}</style></head>
<body><main class="page"><nav class="crumb">内容管理　/　老挝语内容　/　字母管理</nav><header class="hero"><div><h1>字母管理 <span class="count">68 项</span></h1><p class="history">维护老挝语字母、声调符号及其他正字法标记。</p></div></header><section class="card toolbar"><input class="search" data-cmp="input" placeholder="搜索字符、IPA 或说明"><button class="button">全部类型</button><button class="button">状态</button><button class="button">排序</button><button class="button">恢复默认列</button></section><section class="card"><div class="summary"><strong>字母列表</strong>　当前显示 68 项；调整筛选后此处说明结果范围。</div><table data-cmp="table"><thead><tr><th>字符</th><th>类型</th><th>IPA</th><th>音频</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td class="char">ກ</td><td>辅音</td><td>/k/</td><td><span class="badge">标准发音</span></td><td><span class="badge">已发布</span></td><td><button class="button">查看操作</button></td></tr><tr><td class="char">າ</td><td>元音</td><td>/aː/</td><td><span class="badge">标准发音</span></td><td><span class="badge">草稿</span></td><td><button class="button">查看操作</button></td></tr></tbody></table></section><section class="card sidebar"><strong>批量任务历史</strong><button class="button" style="float:right">刷新</button><p class="history">无活动任务时保持收敛；选中记录后才展示批量操作区。</p></section></main></body></html>
