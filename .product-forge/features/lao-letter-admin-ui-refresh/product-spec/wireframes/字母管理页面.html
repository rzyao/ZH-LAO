<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>字母管理：详细线框</title><style>body{font:14px system-ui,sans-serif;background:#f5f5f5;padding:32px;color:#222}.page{margin:auto;max-width:1200px}.box{border:1px solid #aaa;border-radius:8px;background:#fff;padding:16px;margin:12px 0}.muted{color:#666}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}.primary{background:#333;color:#fff;border-radius:6px;padding:9px 14px}.filters{background:#f7f7f7}.table{height:250px;background:repeating-linear-gradient(#fff,#fff 42px,#eee 43px)}.history{max-width:420px}</style></head>
<body><main class="page"><p class="muted">内容管理 / 老挝语内容 / 字母管理</p><section class="row"><div class="grow"><h1>字母管理 <span class="muted">· 68 项</span></h1><p class="muted">维护老挝语字母、声调符号及其他正字法标记。</p></div></section><section class="box filters"><div class="row"><strong>查找与筛选</strong><input class="grow" placeholder="搜索字符、IPA 或描述"><button>辅音 / 元音</button><button>字母类别</button><button>内容状态</button><button>版本状态</button><button>恢复默认列</button></div><p class="muted">筛选条件激活时显示结果范围与“清除筛选”。</p></section><section class="box"><div class="row"><strong class="grow">字母列表</strong><span class="muted">支持排序、列显隐、横向滚动</span></div><div class="table">表头：选择　字符　类型　类别　IPA　排序　音频　状态　操作</div></section><section class="box"><strong>已选择的字母</strong><p class="muted">仅在选择记录后出现：选中范围、批量动作和二次确认入口。</p></section><section class="box history"><div class="row"><strong class="grow">批量任务历史</strong><button>刷新</button></div><p>发布 · 处理中 · 18 / 68　　查看详情</p><p class="muted">作为次级信息，默认不抢占列表工作区。</p></section></main></body>
