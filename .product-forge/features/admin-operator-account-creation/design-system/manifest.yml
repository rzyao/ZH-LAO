schema_version: 1
source:
  components_path: "apps/admin/src/components/ui"
  tokens_path: "apps/admin/src/design-system/tokens/index.css"
  framework: "react"
  storybook: false
tokens:
  color:
    background: "var(--background)"
    primary: "var(--primary)"
    primary_foreground: "var(--primary-foreground)"
    destructive: "var(--destructive)"
    muted_foreground: "var(--muted-foreground)"
  radius:
    - "var(--radius-sm)"
    - "var(--radius-md)"
    - "var(--radius-lg)"
components:
  - id: "CMP-Button"
    import: "@/components/ui/button"
    props: ["variant", "size", "loading", "disabled", "onClick"]
    variants: ["default", "outline", "destructive", "secondary", "ghost"]
    selector: "button"
  - id: "CMP-Input"
    import: "@/components/ui/input"
    props: ["id", "type", "placeholder", "aria-invalid"]
    variants: ["text", "password"]
    selector: "input"
  - id: "CMP-Dialog"
    import: "@/components/ui/dialog"
    props: ["open", "onOpenChange"]
    variants: ["default"]
    selector: "[role='dialog']"
  - id: "CMP-FormField"
    import: "apps/admin/src/features/operations/components.tsx"
    props: ["label", "htmlFor", "hint", "error"]
    variants: ["default"]
    selector: "label"
