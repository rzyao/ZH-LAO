schema_version: 1
source:
  components_path: "apps/admin/src/components"
  tokens_path: "apps/admin/src/design-system/tokens/index.css"
  framework: "react"
  storybook: false
tokens:
  color:
    primary: "var(--primary)"
    surface: "var(--card)"
    muted: "var(--muted)"
    border: "var(--border)"
  radius: ["rounded-md", "rounded-lg", "rounded-xl"]
components:
  - id: "CMP-Button"
    import: "@/components/ui/button"
    props: ["variant", "size", "loading", "disabled", "onClick"]
    variants: ["default", "destructive", "outline", "secondary", "ghost", "link"]
  - id: "CMP-Dialog"
    import: "@/components/ui/dialog"
    props: ["open", "onOpenChange"]
  - id: "CMP-ConfirmDialog"
    import: "@/components/feedback/confirm-dialog"
    props: ["open", "title", "description", "destructive", "onConfirm"]
