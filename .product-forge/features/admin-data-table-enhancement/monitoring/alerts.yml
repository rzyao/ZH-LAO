feature: "admin-data-table-enhancement"
owner: "Content"
alerts:
  - name: "lo-letter-batch-api-error-rate"
    condition: "5xx or INTERNAL_ERROR rate for /api/v1/admin/content/lo/letters/batch-tasks exceeds 1% for 5 minutes"
    severity: "P1"
    action: "Disable batch-task admission, roll back the application, retain the additive schema."
  - name: "lo-letter-batch-queue-stall"
    condition: "queued/running task age exceeds 15 minutes or failed tasks increase unexpectedly"
    severity: "P1"
    action: "Inspect worker health, task counters and Content audit records; do not retry successful/skipped items."
  - name: "lo-letter-list-latency"
    condition: "p95 GET /api/v1/admin/content/lo/letters exceeds 500 ms for 10 minutes"
    severity: "P2"
    action: "Review query plan, index health and pagination/filter distribution."
  - name: "lo-letter-batch-history-storage"
    condition: "task/item table or index growth exceeds the Content capacity budget"
    severity: "P2"
    action: "Scale capacity; retention is long-term and cannot be silently reduced."
