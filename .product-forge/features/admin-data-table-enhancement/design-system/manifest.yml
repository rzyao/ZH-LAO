schema_version: 1
source:
  components_path: "apps/admin/src/components"
  tokens_path: "apps/admin/src/design-system/tokens/index.css"
  framework: "react"
  storybook: false
tokens:
  color:
    background: "var(--background)"
    foreground: "var(--foreground)"
    primary: "var(--primary)"
    destructive: "var(--destructive)"
    muted: "var(--muted)"
    border: "var(--border)"
    ring: "var(--ring)"
  typography:
    body: "var(--font-sans)"
    mono: "var(--font-mono)"
  radius:
    - "var(--radius-sm)"
    - "var(--radius-md)"
    - "var(--radius-lg)"
  shadows:
    - "var(--shadow-xs)"
    - "var(--shadow-sm)"
    - "var(--shadow-md)"
components:
  - id: "CMP-DataTable"
    import: "@/components/data-table/data-table"
    props: ["columns", "data", "loading", "error", "toolbar", "showViewOptions", "showPagination", "getRowId", "enableRowSelection"]
    variants: ["client-data"]
    selector: "[data-testid='data-table']"
  - id: "CMP-DataTablePagination"
    import: "@/components/data-table/data-table-pagination"
    props: ["table", "pageSizeOptions"]
    variants: ["client-data"]
    selector: "nav[aria-label='分页']"
  - id: "CMP-Button"
    import: "@/components/ui/button"
    props: ["variant", "size", "loading", "disabled", "onClick"]
    variants: ["default", "destructive", "outline", "secondary", "ghost", "link"]
    selector: "button"
  - id: "CMP-Checkbox"
    import: "@/components/ui/checkbox"
    props: ["checked", "onCheckedChange", "disabled"]
    variants: ["default"]
    selector: "button[role='checkbox']"
  - id: "CMP-Input"
    import: "@/components/ui/input"
    props: ["value", "onChange", "placeholder", "aria-label"]
    variants: ["default"]
    selector: "input"
  - id: "CMP-Select"
    import: "@/components/ui/select"
    props: ["value", "onValueChange", "disabled"]
    variants: ["default"]
    selector: "button[role='combobox']"
  - id: "CMP-DropdownMenu"
    import: "@/components/ui/dropdown-menu"
    props: ["children"]
    variants: ["item", "checkbox-item"]
    selector: "[role='menu']"
  - id: "CMP-Dialog"
    import: "@/components/ui/dialog"
    props: ["open", "onOpenChange", "children"]
    variants: ["default"]
    selector: "[role='dialog']"
  - id: "CMP-Table"
    import: "@/components/ui/table"
    props: ["children"]
    variants: ["default"]
    selector: "table"
  - id: "CMP-EmptyState"
    import: "@/components/feedback/empty-state"
    props: ["title", "description"]
    variants: ["default"]
    selector: "[data-testid='empty-state']"
  - id: "CMP-ErrorState"
    import: "@/components/feedback/error-state"
    props: ["error", "onRetry"]
    variants: ["default"]
    selector: "[role='alert']"
